---
# Integration test for shell registration feature (001-register-shell-support)
# Tests: Module declares shell registration, idempotency, optional field behavior
#
# Uses a temp file instead of /etc/shells so no sudo is required.

- name: Test shell registration functionality
  hosts: localhost
  vars:
    dotmodules:
      repo: 'file://{{ playbook_dir }}/fixtures/test-shell-registration'
      dest: '{{ playbook_dir }}/.test-dotmodules-shell'
      install:
        - module-with-zsh
        - module-without-shell
        - module-with-empty-shell
    home_dir: '{{ playbook_dir }}/.test-home-shell'
    shells_file: '{{ playbook_dir }}/.test-etc-shells'

  tasks:
    - name: Clean up previous test artifacts
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop:
        - '{{ dotmodules.dest }}'
        - '{{ home_dir }}'
        - '{{ shells_file }}'

    - name: Create test home directory
      ansible.builtin.file:
        path: '{{ home_dir }}'
        state: directory
        mode: '0755'

    - name: Create test /etc/shells file
      ansible.builtin.copy:
        dest: '{{ shells_file }}'
        content: |
          # List of acceptable shells for chpass(1).
          /bin/bash
          /bin/sh
          /bin/zsh
        mode: '0644'

    - name: Include ansible-role-dotmodules role
      ansible.builtin.include_role:
        name: ansible-role-dotmodules

    - name: Detect current architecture for expected shell path
      ansible.builtin.set_fact:
        expected_homebrew_prefix: "{{ '/opt/homebrew' if ansible_facts['machine'] == 'arm64' else '/usr/local' }}"
        expected_zsh_path: "{{ ('/opt/homebrew' if ansible_facts['machine'] == 'arm64' else '/usr/local') + '/bin/zsh' }}"

    # Verify shell was registered in test file
    - name: Check if shell was added to test shells file
      ansible.builtin.command: grep -q '{{ expected_zsh_path }}' '{{ shells_file }}'
      register: shell_registered
      changed_when: false

    - name: Assert shell was registered
      ansible.builtin.assert:
        that:
          - shell_registered.rc == 0
        success_msg: 'Shell {{ expected_zsh_path }} registered successfully'
        fail_msg: 'Shell {{ expected_zsh_path }} was not registered in {{ shells_file }}'

    - name: Verify all modules were processed successfully
      ansible.builtin.assert:
        that:
          - "'module-with-zsh' in dotmodules.install"
          - "'module-without-shell' in dotmodules.install"
          - "'module-with-empty-shell' in dotmodules.install"
        success_msg: 'All modules processed successfully'
        fail_msg: 'One or more modules failed to process'

    - name: Verify architecture-based path detection logic
      ansible.builtin.assert:
        that:
          - ansible_facts['machine'] in ['arm64', 'x86_64']
          - expected_homebrew_prefix in ['/opt/homebrew', '/usr/local']
        success_msg: 'Cross-platform path detection working correctly'
        fail_msg: 'Cross-platform path detection failed'

    # Test idempotency - run role again
    - name: Run role second time to test idempotency
      ansible.builtin.include_role:
        name: ansible-role-dotmodules

    - name: Count shell entries in test file (should be exactly one)
      ansible.builtin.shell: grep -c '{{ expected_zsh_path }}' '{{ shells_file }}'
      register: shell_count
      changed_when: false

    - name: Assert no duplicate entries
      ansible.builtin.assert:
        that:
          - shell_count.stdout | int == 1
        success_msg: 'Idempotency verified - exactly one entry'
        fail_msg: 'Duplicate entries found: {{ shell_count.stdout }}'

    - name: Final integration validation
      ansible.builtin.assert:
        that:
          - dotmodules is defined
          - dotmodules.install | length == 3
        success_msg: 'Integration test PASSED - all scenarios validated'
        fail_msg: 'Integration test FAILED'

    # Clean up
    - name: Clean up test artifacts
      ansible.builtin.file:
        path: '{{ item }}'
        state: absent
      loop:
        - '{{ dotmodules.dest }}'
        - '{{ home_dir }}'
        - '{{ shells_file }}'
